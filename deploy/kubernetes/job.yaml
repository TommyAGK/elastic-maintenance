apiVersion: batch/v1
kind: Job
metadata:
  name: elastic-maintenance
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: elastic-maintenance
          image: ghcr.io/example/elastic-maintenance:latest
          args:
            - --mode=apply
            - --config=/etc/elastic-maintenance/desired-state.json
          env:
            - name: KIBANA_URL
              valueFrom:
                secretKeyRef:
                  name: elastic-maintenance-secrets
                  key: kibana-url
            - name: KIBANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic-maintenance-secrets
                  key: kibana-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/elastic-maintenance
      volumes:
        - name: config
          configMap:
            name: elastic-maintenance-config

